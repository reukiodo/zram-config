name: Debian Package Build
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run ShellCheck Analysis
        uses: ludeeus/action-shellcheck@master
        with:
          # Scans zram-config script and your debian maintainer control scripts
          scandir: '.'
          additional_files: 'debian/prerm debian/postrm'
        env:
          # Optional: enforce strict POSIX checking or ignore specific warnings if needed
          SHELLCHECK_OPTS: --severity=error -s sh

      - name: Validate Man Page Syntax (groff)
        run: |
          sudo apt-get update && sudo apt-get install -y groff
          
          # Render the page to a null stream using warnings activation (-w w)
          # If groff detects unclosed markers or layout bugs, it exits with an error
          groff -man -t -z -w w debian/ztab.5

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Identity
        id: ident
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "NAME=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "EMAIL=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_ENV

      - name: Print environment variables for debugging
        run: env | sort

      - name: Fetch overlayfs-tools Dependency from GitHub Releases
        run: |
          # Use GitHub CLI to download the asset directly from your target release page
          gh release download \
            --repo reukiodo/overlayfs-tools \
            --pattern "overlayfs-tools_*.deb" \
            --dir ./packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Package
        uses: docker://debian/buildd:sid
        env:
          DEBFULLNAME: ${{ env.NAME }}
          DEBEMAIL: ${{ env.EMAIL }}
        with:
          args: >
            sh -c "apt-get update &&
            apt-get install -y debhelper devscripts git lintian ./packages/*.deb &&
            git config --global --add safe.directory /github/workspace &&
            mk-build-deps -ir -t 'apt-get -y' &&
            dpkg-buildpackage -us -uc -b &&
            echo 'BUILD_COMPLETE' &&
            lintian ../*.deb &&
            apt-get install -y ../*.deb"
